<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="../assets/img/favicon/favicon-join.svg" type="image/x-icon" />
  <title>Contacts</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../styles/sidebar.css" />
  <link rel="stylesheet" href="../styles/utility.css" />
  <link rel="stylesheet" href="../styles/contacts.css" />
  <link rel="stylesheet" href="../styles/contact-cuccsses-edit-overlay.css">
  <link rel="stylesheet" href="../styles/contact-details-overlay.css">
  <link rel="stylesheet" href="../styles/create-contact-overlay.css">
  <link rel="stylesheet" href="../styles/fonts.css" />
  <link rel="stylesheet" href="../styles/colors.css" />
  <script defer src="../scripts/utilitys.js"></script>
  <script defer src="../scripts/contacts-update.js"></script>
  <script defer src="../scripts/contacts.js"></script>
  <script defer src="../scripts/contacts-template.js"></script>

</head>

<body class="app" onload="init(); initUtilitys()">
<div class="landscape-warning">
    <div class="warning-message">
      <div class="phone-icon"></div>
      <p>Use portrait mode.</p>
    </div>
  </div>

  <header class="app--title">
    <div class="app--title-wrapper">
      <h1 class="app--title-headline">Kanban Project Management Tool</h1>
      <img src="../assets/img/logo-join-dark.svg" alt="join logo" class="title-logo" />
      <div class="app--icons">
        <a href="./help.html"><img src="../assets/img/icons/general/help.svg" alt="help" class="app--icon" /></a>
        <button type="button" id="user_menu_button" class="btn btn--user" onclick="openUserMenu()"
          aria-label="Show User Menu"></button>
      </div>
    </div>
  </header>

  <dialog id="user-menu-dialog" onclick="closeDialog()">
    <div class="user-menu" onclick="preventCloseDialogOnDialog(event)">
      <a href="../html/help.html" class="user-menu-help user-menu-link">Help</a>
      <a href="../html/legalNotice.html" class="user-menu-link">Legal Notice</a>
      <a href="../html/privacyPolicy.html" class="user-menu-link">Privacy Policy</a>
      <a href="#" class="user-menu-link" onclick="logOut()">Log out</a>
    </div>
  </dialog>

  <nav class="sidebar">
    <img class="nav-logo" src="../assets/img/logo-join.svg" alt="join_logo" />
    <ul>
      <li class="">
        <a class="nav-category" href="./summary.html"><img class="nav-category-img"
            src="../assets/img/icons/general/summary.svg" alt="" />Summary</a>
      </li>
      <li class="">
        <a class="nav-category" href="./addTaskPage.html"><img class="nav-category-img"
            src="../assets/img/icons/general/add-task.svg" alt="" />Add Task</a>
      </li>
      <li class="">
        <a class="nav-category" href="./board.html"><img class="nav-category-img"
            src="../assets/img/icons/general/board.svg" alt="" />Board</a>
      </li>
      <li class="active">
        <a class="nav-category" href="./contacts.html"><img class="nav-category-img"
            src="../assets/img/icons/general/contacts.svg" alt="" /> Contacts</a>
      </li>
    </ul>

    <div class="legal-section">
      <a class="legal-section-link" href="../html/privacyPolicy.html">Privacy Policy</a>
      <a class="legal-section-link" href="../html/legalNotice.html">Legal Notice</a>
    </div>
  </nav>

  <main class="main-content">

    <div id="left_content" class="left-content">
      <div class="add-button-container">
        <button id="add_button" type="button" class="desktop-only btn btn--primary add-button-size btn-add-contact"
          onclick="openContactDialog()">
          <span class="add-button-text">Add new contact</span>
          <img  src="../assets/img/icons/contacts/person_add.svg" alt="contact icon">
        </button>
        <button type="button" class="mobile-only btn--addPerson" onclick="openContactDialog()">
          <img class="add-contact-mobile-icon" src="../assets/img/icons/contacts/person_add.svg" alt="contact">
        </button>
      </div>

      <div id="contact_list" class="contact-list">
        <div id="single_contacts" class="single-contacts"></div>
      </div>
    </div>

    <div id="right_content" class="right-content" onclick="closeMobileMenu()">
      <div class="headline">
        <h1 class="contacts-title">Contacts</h1>
        <div class="vertical-divider"></div>
        <span class="contacts-subtitle">Better with a team</span>
        <button id="back_arrow_button" type="button" aria-label="Back to Contact list Button"
          onclick="backToContactlist()">
          <img id="back_arrow_icon" alt="back-arrow-icon" class="back-arrow"
            src="../assets/img/icons/contacts/Vector.svg">
        </button>
        <button id="edit_menu_button" type="button" class="mobile-only" onclick="openEditMenu(event)">
          <img id="edit_menu_icon" alt="edit-meni-icon" class="edit-menu"
            src="../assets/img/icons/contacts/more_vert.svg">
        </button>
        <div id="contact_success_overlay" class="contact-success-overlay hide-overlay">
          <span>Contact successfully created</span>
        </div>
      </div>
      <div id="contact_details_dialog"></div>
    </div>

  </main>

  <dialog class="dialog-content" id="open_new_dialog" onclick="closeContactDialog()">
  </dialog>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="../assets/img/favicon/favicon-join.svg" type="image/x-icon" />
  <title>Contacts</title>

  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../styles/sidebar.css" />
  <link rel="stylesheet" href="../styles/contacts.css" />

  <link rel="stylesheet" href="../styles/fonts.css" />
  <link rel="stylesheet" href="../styles/colors.css" />
  <script defer src="../scripts/contacts.js"></script>
  <script defer src="../scripts/contacts-template.js"></script>
</head>

<body class="app" onload="init()">
  <header class="app--title">
    <h1 class="app--title-headline">Kanban Project Management Tool</h1>
    <div class="app--icons">
      <a href="./help.html"><img src="../assets/img/icons/general/help.svg" alt="?" class="app--icon" /></a>
      <img src="../assets/img/user_initials.svg" alt="M L" class="app--initials" />
    </div>
  </header>
  <nav class="sidebar">
    <img class="nav-logo" src="../assets/img/logo-join.svg" alt="join_logo" />
    <ul>
      <li class="active">
        <a class="nav-category" href="./summary.html"><img class="nav-category-img"
            src="../assets/img/icons/general/summary.svg" alt="" />Summary</a>
      </li>
      <li class="">
        <a class="nav-category" href="./addTaskPage.html"><img class="nav-category-img"
            src="../assets/img/icons/general/add-task.svg" alt="" />Add Task</a>
      </li>
      <li class="">
        <a class="nav-category" href="./board.html"><img class="nav-category-img"
            src="../assets/img/icons/general/board.svg" alt="" />Board</a>
      </li>
      <li class="">
        <a class="nav-category" href="./contacts.html"><img class="nav-category-img"
            src="../assets/img/icons/general/contacts.svg" alt="" /> Contacts</a>
      </li>
    </ul>

    <div class="legal-section">
      <a class="legal-section-link" href="../html/privacyPolicy.html">Privacy Policy</a>
      <a class="legal-section-link" href="../html/legalNotice.html">Legal Notice</a>
    </div>
  </nav>

  <main class="main-content">

    <div class="left-content">

      <button type="button" class="btn btn--primary add-button-size" onclick="openContactDialog()">
        Add new contact
        <img class="add-contact-icon" src="../assets/img/icons/general/person_add.svg" alt="add contact button">
      </button>
      <div class="contact-list">
        <div id="contactList" class="contact-data">Radek</div>
      </div>
    </div>

    <div class="right-content">
      <div class="headline">
        <h1 class="contacts-title">Contacts</h1>
        <div class="vertical-divider"></div>
        <span class="contacts-subtitle">Better with a team</span>
        <div id="contactDetails" class="contact-details"></div>
      </div>

  </main>

  <dialog class="dialog-content" id="openNewDialog" onclick="closeContactDialog()">

    <div class="dialog-container" onclick="closeDialogOutsite(event)">

      <aside class="aside-content">
        <img class="aside-logo" src="../assets/img/logo-join.svg" alt="logo-join" />
        <section class="aside-text-wrapper">
          <h2 class="aside-h2">Add contact</h2>
          <p class="aside-p">Tasks are better with a team!</p>
          <div class="blue-line-horizontal"></div>
        </section>
      </aside>

      <header class="dialog-header">
        <button type="button" id="close-btn" class="close-btn-overlay" onclick="closeContactDialog()">x</button>
      </header>

      <main class="dialog-main">

        <div class="person-Logo-container">
          <img class="person-logo" src="../assets/img/icons/input/person.svg" alt="Profile" class="large-profile-icon">
        </div>

        <form>
          <section class="dialog-input-container">
            <div class="dialog-input-section">
              <input class="dialog-input" type="text" name="name" placeholder="Name" required />
              <img src="../assets/img/icons/input/person.svg" alt="icon" class="dialog-input-icon" />
            </div>

            <div class="dialog-input-section">
              <input class="dialog-input" id="email" type="email" name="email" placeholder="Email" required />
              <img src="../assets/img/icons/input/mail.svg" alt="icon" class="dialog-input-icon" />
            </div>

            <div class="dialog-input-section">
              <input class="dialog-input" type="tel" name="phone" placeholder="Phone" required />
              <img src="../assets/img/icons/input/phone.svg" alt="icon" class="dialog-input-icon" />
            </div>
          </section>
          <section class="dialog-login-buttons">
            <button type="button" class="btn btn--secondary btn--login"
              onclick="document.getElementById('addNewContact').close()">Cancel<img class="img-x"
                src="../assets/img/icons/general/close-dark.svg" alt="checkbox cancel"></button>
            <button type="submit" class="btn btn--primary btn--login">Create contact <img class="img-check"
                src="../assets/img/icons/general/check.svg" alt="create check"> </button>
          </section>
        </form>
        <script></script>
      </main>
    </div>
  </dialog>
</body>

</html>

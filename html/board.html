<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../assets/img/favicon/favicon-join.svg" type="image/x-icon" />
    <title>Join - Board</title>
    <script src="../scripts/utilitys.js"></script>

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/colors.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/board.css" />
    <link rel="stylesheet" href="../styles/board-dialog.css" />

    <script src="../scripts/templates.js"></script>
    <script src="../scripts/utilitys.js"></script>
    <script src="../scripts/board-dialog.js"></script>
    <script src="../scripts/board.js"></script>
  </head>

  <body class="app" onload="(initUtilitys(), initBoard())">
    <header class="app--title">
      <h1 class="app--title-headline">Kanban Project Management Tool</h1>
      <img src="../assets/img/logo-join-dark.svg" alt="join logo" class="title-logo" />
      <div class="app--icons">
        <a href="./help.html"><img src="../assets/img/icons/general/help.svg" alt="help" class="app--icon" /></a>
        <button id="user_menu_button" class="btn btn--user"></button>
      </div>
    </header>

    <nav class="sidebar">
      <img class="nav-logo" src="../assets/img/logo-join.svg" alt="join_logo" />
      <ul>
        <li class="">
          <a class="nav-category" href="./summary.html"><img class="nav-category-img" src="../assets/img/icons/general/summary.svg" alt="" />Summary</a>
        </li>
        <li class="">
          <a class="nav-category" href="./addTaskPage.html"><img class="nav-category-img" src="../assets/img/icons/general/add-task.svg" alt="" />Add Task</a>
        </li>
        <li class="active">
          <a class="nav-category" href="./board.html"><img class="nav-category-img" src="../assets/img/icons/general/board.svg" alt="" />Board</a>
        </li>
        <li class="">
          <a class="nav-category" href="./contacts.html"><img class="nav-category-img" src="../assets/img/icons/general/contacts.svg" alt="" /> Contacts</a>
        </li>
      </ul>

      <div class="legal-section">
        <a class="legal-section-link" href="../html/privacyPolicy.html">Privacy Policy</a>
        <a class="legal-section-link" href="../html/legalNotice.html">Legal Notice</a>
      </div>
    </nav>
    <main class="app--content">
      <article class="header-section">
        <h1>Board</h1>

        <sectioin class="search-container">
          <input type="text" id="search_tasks" class="task-search-input" placeholder="Find Task" />
          <span class="search-divider"></span>
          <button id="search_tasks_btn" class="btn" role="search"><img src="../assets/img/icons/input/search.svg" alt="🔍search" class="search-icon" /></button>
        </sectioin>

        <button class="btn btn--primary">
          <span class="btn--primary-text" id="add_task_head">Add task</span>
          <img src="../assets/img/icons/subtask/add-white.svg" alt="+" />
        </button>
      </article>

      <section class="kanban-columns" aria-label="Kanban Board">
        <section class="kanban-column" ondragover="allowDrop(event)" ondrop="taskDragDrop('todo')" ondragenter="columnDragEnter(event, 'todo')" ondragleave="columnDragLeave(event)">
          <div class="column-title">
            <h2>To do</h2>
            <button class="btn btn--add-task" aria-label="Add task to To do" onclick="addStatusTask('todo')">
              <img src="../assets/img/icons/subtask/add.svg" alt="" aria-hidden="true" />
            </button>
          </div>
          <ul class="task--list" id="todo_list"></ul>
        </section>

        <section class="kanban-column" ondragover="allowDrop(event)" ondrop="taskDragDrop('progress')" ondragenter="columnDragEnter(event, 'progress')" ondragleave="columnDragLeave(event)">
          <div class="column-title">
            <h2>In progress</h2>
            <button class="btn btn--add-task" aria-label="Add task to In progress" onclick="addStatusTask('progress')">
              <img src="../assets/img/icons/subtask/add.svg" alt="" aria-hidden="true" />
            </button>
          </div>
          <ul class="task--list" id="progress_list"></ul>
        </section>

        <section class="kanban-column" ondragover="allowDrop(event)" ondrop="taskDragDrop('feedback')" ondragenter="columnDragEnter(event, 'feedback')" ondragleave="columnDragLeave(event)">
          <div class="column-title">
            <h2>Await feedback</h2>
            <button class="btn btn--add-task" aria-label="Add task to Await feedback" onclick="addStatusTask('feedback')">
              <img src="../assets/img/icons/subtask/add.svg" alt="" aria-hidden="true" />
            </button>
          </div>
          <ul class="task--list" id="feedback_list"></ul>
        </section>

        <section class="kanban-column" ondragover="allowDrop(event)" ondrop="taskDragDrop('done')" ondragenter="columnDragEnter(event, 'done')" ondragleave="columnDragLeave(event)">
          <div class="column-title">
            <h2>Done</h2>
            <button class="btn btn--add-task" aria-label="Add task to Done" onclick="addStatusTask('done')">
              <img src="../assets/img/icons/subtask/add.svg" alt="" aria-hidden="true" />
            </button>
          </div>
          <ul class="task--list" id="done_list"></ul>
        </section>
      </section>

      <!-- add task dialog -->
      <dialog id="add_task_dialog" class="dialog slide-in test-dialog">
        <header></header>
        <article aria-label="add task dialog">
          <form></form>
        </article>
      </dialog>

      <!-- detail task dialog -->
      <dialog id="task_detail_dialog" class="dialog slide-in detail-task">
      </dialog>
    </main>
  </body>
</html>

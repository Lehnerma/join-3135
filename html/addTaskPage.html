<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../assets/img/favicon/favicon-join.svg" type="image/x-icon" />
    <title>Join - Add Task</title>

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/colors.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/addTask.css" />
  </head>

<body class="app">

    <header class="app--title">
        <h1 class="app--title-headline">Kanban Project Management Tool</h1>
        <div class="app--icons">
            <a href="./help.html"><img src="../assets/img/icons/general/help.svg" alt="?" class="app--icon" /></a>
            <img src="../assets/img/user_initials.svg" alt="M L" class="app--initials" />
        </div>
    </header>

    <nav class="sidebar">
        <img class="nav-logo" src="../assets/img/logo-join.svg" alt="join_logo" />
        <ul>
            <li class="">
                <a class="nav-category" href="summary.html"><img class="nav-category-img"
                        src="../assets/img/icons/general/summary.svg" alt="" />Summary</a>
            </li>
            <li class="">
                <a class="nav-category" href="addTaskPage.html"><img class="nav-category-img"
                        src="../assets/img/icons/general/add-task.svg" alt="" />Add Task</a>
            </li>
            <li class="">
                <a class="nav-category" href="board.html"><img class="nav-category-img"
                        src="../assets/img/icons/general/board.svg" alt="" />Board</a>
            </li>
            <li class="">
                <a class="nav-category" href="contacts.html"><img class="nav-category-img"
                        src="../assets/img/icons/general/contacts.svg" alt="" />Contacts</a>
            </li>
        </ul>

        <div class="legal-section">
            <a class="legal-section-link" href="#">Privacy Policy</a>
            <a class="legal-section-link" href="#">Legal Notice</a>
        </div>
    </nav>

    <main class="app--content">

        <div class="board-title-container">
            <h1>Add Task</h1>


            <form class="task-form" onsubmit="createTask(event)">

                <div class="form-columns">

                    <!-- Linke Spalte -->
                    <div class="column">
                        <label>Title<span>*</span></label>
                        <input id="title" type="text" placeholder="Enter a title">

                        <label>Description</label>
                        <textarea id="description" placeholder="Enter a Description"></textarea>

                        <label>Due date<span>*</span></label>
                        <input id="dueDate" type="date">
                    </div>

                    <div class="divider"></div>

          <!-- Rechte Spalte -->
          <section class="column right">
            <!-- priority -->
            <div class="input-section">
              <label for="priority">Priority</label>
              <div class="priority-group">
                <button type="button" id="btn-urgent" class="prio-btn" onclick="selectPriority('urgent')">
                  Urgent
                  <img class="img-prio urgent" src="../assets/img/icons/prio/urgent.svg" alt="" />
                </button>
                <button type="button" id="btn-medium" class="prio-btn" onclick="selectPriority('medium')">
                  Medium
                  <img class="img-prio medium" src="../assets/img/icons/prio/medium.svg" alt="" />
                </button>
                <button type="button" id="btn-low" class="prio-btn" onclick="selectPriority('low')">
                  Low
                  <img class="img-prio low" src="../assets/img/icons/prio/low.svg" alt="" />
                </button>
              </div>
            </div>
            <!-- assignt to -->
            <div class="input-section">
              <label for="assignedTo">Assigned to</label>
              <select id="assignedTo" class="input dropdown">
                <option value="">Select contacts to assign</option>
              </select>
            </div>
            <!-- category -->
            <div class="input-section">
              <label for="category" class="required">Category</label>
              <select id="category" class="input dropdown">
                <option value="none" selected>Select task category</option>
                <option value="Technical Task">Technical Task</option>
                <option value="User Story">User Story</option>
              </select>
            </div>
            <!-- subtask -->
            <div class="input-section">
              <label for="subtask">Subtasks</label>
              <div class="input--section">
                <input id="subtask" class="input" type="text" placeholder="Add subtask" />
                <div class="subtask--btns">
                  <button id="subtask-close" class="btn--subtask close"><img src="../assets/img/icons/subtask/close.svg" alt="x" /></button>
                  <span class="div-vert"></span>
                  <button id="subtask-save" class="btn--subtask check"><img src="../assets/img/icons/subtask/check.svg" alt="check" /></button>
                </div>
              </div>
            </div>
          </section>
          <!-- info -->
          <section class="form-info-section">
            <p><b class="form-info">*</b> This field is required</p>
          </section>
          <!-- footer -->
          <section class="form-footer">
            <div class="action-btns">
              <button type="reset" class="btn btn--secondary clear">Clear</button>
              <button type="submit" class="btn btn--primary">Create Task</button>
            </div>
          </section>
        </form>
      </article>
    </main>

    <!-- <div id="toast" class="toast">Task added to board ✅</div> -->

    <script>

        let selectedPriority = "medium";
        let selectedUsers = [];
        let subtasks = [];

        const usersData = {
            c1: { name: "Anton Schmidt", color: "blue" },
            c10: { name: "Julia Meyer", color: "green" },
            c11: { name: "Kevin Neu", color: "orange" },
            c12: { name: "Laura Otto", color: "red" }
        };


        function selectPriority(prio) {
            selectedPriority = prio;

            document.getElementById('btn-urgent').classList.remove('urgent-active');
            document.getElementById('btn-medium').classList.remove('medium-active');
            document.getElementById('btn-low').classList.remove('low-active');

            const activeBtn = document.getElementById('btn-' + prio);
            activeBtn.classList.add(prio + '-active');
        }

        function createTask(event) {
            event.preventDefault();


            let title = document.getElementById("title").value;
            let dueDate = document.getElementById("dueDate").value;

            if (!title || !dueDate) {
                alert("Title and Due Date are required!");
                return;
            }

            let task = {
                title: title,
                description: document.getElementById("description").value,
                dueDate: dueDate,
                category: document.getElementById("category").value,
                assignedTo: selectedUsers,
                priority: selectedPriority,
                status: "todo",
                subtasks: subtasks
            };

            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            tasks.push(task);
            localStorage.setItem("tasks", JSON.stringify(tasks));

            showToast("Task added to board ✅");

            setTimeout(() => {
                window.location.href = "board.html";
            }, 1000);


        }

        function renderUserOptions() {
            let select = document.getElementById("assignedTo");

            select.innerHTML = `<option value="">Select contacts to assign</option>`;

            for (let key in usersData) {
                let user = usersData[key];

                let isSelected = selectedUsers.includes(user.name);

                select.innerHTML += `
                    <option value="${user.name}">
                         ${user.name} ${isSelected ? "☑ " : "☐ "} 
                    </option>`;
            }

        }



        function selectUser(value) {
            if (!value) return;

            let index = selectedUsers.indexOf(value);

            if (index === -1) {
                selectedUsers.push(value);
            } else {
                selectedUsers.splice(index, 1);
            }

            renderUserOptions();
            renderAssignedUser();

            document.getElementById("assignedTo").value = "";
        }



        window.onload = function () {
            selectPriority("medium");
            renderUserOptions();
        };


        function getFirstLetter(Fullname) {
            let part = Fullname.split(" ");
            if (part.length < 2) return part[0].charAt(0);
            return part[0].charAt(0) + part[1].charAt(0);

        }


        function renderAssignedUser(firstName, lastName) {
            let container = document.getElementById("assignedContainer");
            let html = "";

            for (let i = 0; i < selectedUsers.length; i++) {
                let name = selectedUsers[i];
                let firstLetter = getFirstLetter(name);

                let color = "#ccc"; // fallback

                for (let key in usersData) {
                    if (usersData[key].name === name) {
                        color = usersData[key].color;
                    }
                }

                html += `
                    <div class="assignedUserField">
                    <div class="user-circle" style="background-color: ${color};">
                      ${firstLetter}
                    </div>
                    </divY
                        `;
            }
            container.innerHTML = html;
        }

        renderAssignedUser();












        function renderSubtasks() {
            let container = document.getElementById("subtaskList");

            container.innerHTML = "";

            for (let i = 0; i < subtasks.length; i++) {
                container.innerHTML += `
            <div class="subtask-item">
                <span class="dot">•</span>
                <span>${subtasks[i].title}</span>
                <span onclick="removeSubtask(${i})">✕</span>
            </div>
        `;
            }
        }


        function removeSubtask(index) {
            subtasks.splice(index, 1);
            renderSubtasks();
        }

        renderSubtasks();




        function addSubtask() {
            let input = document.getElementById("subtaskInput");
            let value = input.value.trim();

            if (value === "") return;

            subtasks.push({
                title: value,
                done: false
            });

            input.value = "";
            renderSubtasks();
        }



        function showToast(message) {
            let toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 2000);
        }















    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Add Task</title>

    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/colors.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <!-- <link rel="stylesheet" href="../styles/addTaskPage.css" /> -->
    <link rel="stylesheet" href="../styles/addTask.css" />
  </head>

  <body class="app">
    <header class="app--title">
      <h1 class="app--title-headline">Kanban Project Management Tool</h1>
      <img src="../assets/img/logo-join-dark.svg" alt="join logo" class="title-logo" />
      <div class="app--icons">
        <a href="./help.html"><img src="../assets/img/icons/general/help.svg" alt="help" class="app--icon" /></a>
        <button id="user-menu-button" class="btn btn--user">ML</button>
      </div>
    </header>

    <nav class="sidebar">
      <img class="nav-logo" src="../assets/img/logo-join.svg" alt="join_logo" />
      <ul>
        <li class="">
          <a class="nav-category" href="summary.html"><img class="nav-category-img" src="../assets/img/icons/general/summary.svg" alt="" />Summary</a>
        </li>
        <li class="active">
          <a class="nav-category" href="addTaskPage.html"><img class="nav-category-img" src="../assets/img/icons/general/add-task.svg" alt="" />Add Task</a>
        </li>
        <li class="">
          <a class="nav-category" href="board.html"><img class="nav-category-img" src="../assets/img/icons/general/board.svg" alt="" />Board</a>
        </li>
        <li class="">
          <a class="nav-category" href="contacts.html"><img class="nav-category-img" src="../assets/img/icons/general/contacts.svg" alt="" />Contacts</a>
        </li>
      </ul>

      <div class="legal-section">
        <a class="legal-section-link" href="#">Privacy Policy</a>
        <a class="legal-section-link" href="#">Legal Notice</a>
      </div>
    </nav>

    <main class="app--content">
      <article class="task-container">
        <h1>Add Task</h1>

        <form class="form-task form-columns" onsubmit="createTask(event)">
          <!-- Linke Spalte -->
          <section class="column left">
            <div class="input-section">
              <label for="title" class="required">Title</label>
              <input id="title" class="input" type="text" placeholder="Enter a title" />
            </div>
            <div class="input-section">
              <label for="description">Description</label>
              <textarea id="description" class="input" placeholder="Enter a Description"></textarea>
            </div>

            <div class="input-section">
              <label for="dueDate" class="required">Due date</label>
              <input id="dueDate" class="input" type="date" />
            </div>
          </section>

          <div class="divider"></div>

          <!-- Rechte Spalte -->
          <section class="column right">
            <div class="input-section">
              <label for="priority">Priority</label>
              <div class="priority-group">
                <button type="button" id="btn-urgent" class="prio-btn" onclick="selectPriority('urgent')">Urgent</button>
                <button type="button" id="btn-medium" class="prio-btn" onclick="selectPriority('medium')">Medium</button>
                <button type="button" id="btn-low" class="prio-btn" onclick="selectPriority('low')">Low</button>
              </div>
            </div>
            <div class="input-section">
              <label for="assignedTo">Assigned to</label>
              <select id="assignedTo" class="input">
                <option value="">Select contacts to assign</option>
              </select>
            </div>
            <div class="input-section">
              <label for="category" class="required">Category</label>
              <select id="category" class="input">
                <option value="Technical Task">Technical Task</option>
                <option value="User Story">User Story</option>
              </select>
            </div>

            <div class="input-section">
              <label for="subtask">Subtasks</label>
              <div class="subtask-input">
                <input id="subtask" class="input" type="text" placeholder="Add subtask" />
                <span class="subtask-icons">✕ | ✓</span>
              </div>
            </div>
          </section>

          <div class="form-footer">
            <p class="required">This field is required</p>

            <div class="action-buttons">
              <button type="reset" class="btn-clear">Clear ✕</button>
              <button type="submit" class="btn-create">Create Task ✓</button>
            </div>
          </div>
        </form>
      </article>
    </main>

    <div id="toast" class="toast">Task added to board ✅</div>

    <script>
      let selectedPriority = "medium";

      function selectPriority(prio) {
        selectedPriority = prio;

        document.getElementById("btn-urgent").classList.remove("urgent-active");
        document.getElementById("btn-medium").classList.remove("medium-active");
        document.getElementById("btn-low").classList.remove("low-active");

        const activeBtn = document.getElementById("btn-" + prio);
        activeBtn.classList.add(prio + "-active");
      }

      function createTask(event) {
        event.preventDefault();

        let title = document.getElementById("title").value;
        let dueDate = document.getElementById("dueDate").value;

        if (!title || !dueDate) {
          alert("Title and Due Date are required!");
          return;
        }

        let task = {
          title: title,
          description: document.getElementById("description").value,
          dueDate: dueDate,
          category: document.getElementById("category").value,
          assignedTo: document.getElementById("assignedTo").value,
          priority: selectedPriority,
          status: "todo",
          subtasks: [],
        };

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        tasks.push(task);
        localStorage.setItem("tasks", JSON.stringify(tasks));

        showToast("Task added to board ✅");

        setTimeout(() => {
          window.location.href = "board.html";
        }, 1000);
      }

      window.onload = function () {
        selectPriority("medium");
      };

      function showToast(message) {
        let toast = document.getElementById("toast");
        toast.innerText = message;
        toast.classList.add("show");

        setTimeout(() => {
          toast.classList.remove("show");
        }, 2000);
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon/favicon-join.svg" />
    <title>Login</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/colors.css" />
    <link rel="stylesheet" href="../styles/login.css" />

    <script src="./scripts/login.js"></script>
  </head>

  <body onload="init()">
    <header class="header">
      <img class="join-logo" src="./assets/img/logo-join-dark.svg" alt="page-1Logo" />
      <nav class="nav-login" id="nav_login">
        <p class="span-nav-login">Not a Join user?</p>
        <button  type="button" id="signup_btn" class="btn btn--primary btn--signup">Sign up</button>
      </nav>
    </header>

    <main class="main-login">
      <form class="form--container login" id="login">
        <section class="form--title">
          <h1>Log in</h1>
        </section>

        <section class="input--container">
          <div class="input--section">
            <input class="input" id="email" type="email" name="email" placeholder="Email" autocomplete="email" pattern="[a-z0-9._%\+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Please enter a valid email address (e.g., name@example.com)." required />
            <img src="./assets/img/icons/input/mail.svg" alt="letter icon" class="input--icon" />
          </div>

          <div class="input--section">
            <input id="pwInputLogIn" class="input" oninput="logInChangeLockToEye()" type="password" name="password" placeholder="Password" pattern="[a-zA-Z0-9]{3,}"  title="Password must be at least 3 characters long and contain only letters and numbers."  required />
            <img id="lockLogIn" onclick="showPasswordInput('pwInputLogIn', 'lockLogIn')"  src="./assets/img/icons/input/lock.svg" alt="lock icon" class="input--icon" />
          </div>
        </section>
       
        <section class="login-buttons">
          <button type="submit" class="btn btn--primary btn--login login-button-text">Log in</button>
          <button type="button" class="btn btn--secondary btn--login login-button-text" id="guest_login">Guest Log in</button>
        </section>
      </form>

      <form class="form--container signup dnone" id="signup">
        <section class="form--title">
          <button type="button" class="btn btn--arrow" id="signup_back"><img class="arrowBackToLogin" src="../assets/img/icons/general/Vector.svg" alt="zurück zum login" /></button>
          <h1>Sign Up</h1>
        </section>
        <div class="input--container-wrapper">
          <section class="input--container">
            <div class="input--section">
              <input class="input input_signup" id="name" type="text" name="name" placeholder="Name" autocomplete="Name" pattern="^[a-zA-ZÀ-ÿ\s\-\.]+$"  title="Please enter a valid name (letters, spaces, and hyphens only)."  required />
              <img class="input--icon" src="../assets/img/icons/input/person.svg" alt="letter icon" />
            </div>

            <div class="input--section">
              <input class="input input_signup" id="singUpEmail" type="email" name="email" placeholder="Email" autocomplete="email" pattern="[a-z0-9._%\+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Bitte gib eine gültige E-Mail-Adresse ein (z.B. max@mustermann.de)" required />
              <img class="input--icon" src="../assets/img/icons/input/mail.svg" alt="letter icon"  />
            </div>

            <div class="input--section">
              <input class="input input_signup" id="pwInput" oninput="signUpChangeLockToEye()" type="password" name="password" placeholder="Password" pattern="[a-zA-Z0-9]{3,}"  title="Password must be at least 3 characters long and contain only letters and numbers."   required />
              <img class="input--icon" id="lock" onclick="showPasswordInput('pwInput', 'lock')" src="../assets/img/icons/input/lock.svg" alt="lock icon"  />
            </div>
          
            <div class="input--section">
              <input class="input input_signup" id="pwInputConfirm"  oninput="signUpChangeLockToEye()"type="password" name="password" placeholder="Confirm Password" pattern="[a-zA-Z0-9]{3,}"  title="Password must be at least 3 characters long and contain only letters and numbers." required />
              <img class="input--icon" id="lockConfirm" onclick="showPasswordInput('pwInputConfirm', 'lockConfirm')" src="../assets/img/icons/input/lock.svg" alt="lock icon"  />
            </div>
          </section>
         
<div class="success-message dnone" id="success_message">
  <span>You Signed Up successfully</span>
</div>

          <div class="privacy-content">
            <input class="input_signup" title=" Please accept the Privacy policy "    type="checkbox" id="privacy" name="privacy" required />
            <span> I accept the </span>
            <a href="../html/privacyPolicy.html" class="acceptPrivacyPolicy">Privacy policy</a>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--signup ">Sign up</button>
      </form>
    </main>

    <section class="phone-signup" id="phone_signup">
      <p class="span-nav-login">Not a Join user?</p>
      <button type="button" id="signup_phone_btn" class="btn btn--primary btn--signup">Sign up</button>
    </section>

    <footer class="footer-login">
      <div class="footer-content">
        <a href="./html/privacyPolicy.html">
          <p>Privacy Policy</p>
        </a>
        <a href="./html/legalNotice.html">
          <p>Legal notice</p>
        </a>
      </div>
    </footer>
  </body>
</html>
